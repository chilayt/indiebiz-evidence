name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Every gate, stopping at the first failure
        run: python scripts/run_release_gate.py
      - name: Build synthetic demo DB
        run: python scripts/make_demo_db.py --db "$RUNNER_TEMP/demo.db"
      - name: MCP server selftest against the demo DB
        run: python scripts/mcp_server.py --db "$RUNNER_TEMP/demo.db" --selftest
      - name: Documented health-report command must run
        run: python scripts/audit_source.py --db "$RUNNER_TEMP/demo.db" --source demo-prices
      - name: Install and confirm the package declares no runtime dependencies
        run: |
          pip install .
          python -c "import tempfile, os; from indiebiz_evidence import store; p=os.path.join(tempfile.mkdtemp(), 't.db'); con=store.connect(p); store.init_db(con); print('install smoke ok')"
          python scripts/check_no_runtime_deps.py --installed
