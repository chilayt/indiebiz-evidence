name: CI

on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Every gate, stopping at the first failure
        run: python scripts/run_release_gate.py
      - name: Build synthetic demo DB
        run: python scripts/make_demo_db.py --db "$RUNNER_TEMP/demo.db"
      - name: MCP server selftest against the demo DB
        run: python scripts/mcp_server.py --db "$RUNNER_TEMP/demo.db" --selftest
      - name: Documented health-report command must run
        run: python scripts/audit_source.py --db "$RUNNER_TEMP/demo.db" --source demo-prices

  install-acceptance:
    # Codex: the old smoke only imported the package. This proves the first-success
    # path works after `pip install`, from OUTSIDE the repository, on every OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/ibe-venv"
          if [ -f "$RUNNER_TEMP/ibe-venv/Scripts/python.exe" ]; then
            VPY="$RUNNER_TEMP/ibe-venv/Scripts/python.exe"
          else
            VPY="$RUNNER_TEMP/ibe-venv/bin/python"
          fi
          "$VPY" -m pip install --quiet dist/*.whl
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/ibe-venv/Scripts/indiebiz-evidence.exe" ]; then
            IBECMD="$RUNNER_TEMP/ibe-venv/Scripts/indiebiz-evidence.exe"
          else
            IBECMD="$RUNNER_TEMP/ibe-venv/bin/indiebiz-evidence"
          fi
          echo "IBECMD=$IBECMD" >> "$GITHUB_ENV"
      - name: Run the installed console script from outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/ibe-outside"
          cd "$RUNNER_TEMP/ibe-outside"
          "$IBECMD" --version
          "$IBECMD" demo --db demo.db
          "$IBECMD" audit --db demo.db --source demo-prices
          "$IBECMD" mcp --db demo.db --selftest
      - name: Real stdio MCP handshake through the installed entry point
        run: |
          cd "$RUNNER_TEMP/ibe-outside"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_sources","arguments":{}}}' \
            | "$IBECMD" mcp --db demo.db > mcp_out.jsonl
          grep -q '"protocolVersion"' mcp_out.jsonl
          grep -q 'demo-prices' mcp_out.jsonl
          echo "stdio handshake OK"
      - name: Installed metadata declares no runtime dependencies
        run: |
          "$VPY" - <<'PY'
          from importlib.metadata import requires
          r = requires("indiebiz-evidence") or []
          hard = [x for x in r if "extra ==" not in x]
          assert not hard, hard
          print("no runtime deps OK")
          PY