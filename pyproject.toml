[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indiebiz-evidence"
version = "0.6.0"
description = "Auditable evidence layer for your own periodic captures: CSV/JSON import, anomaly detection, and an MCP server your agent can query"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
indiebiz-evidence = "indiebiz_evidence.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
indiebiz_evidence = ["schema.sql", "demo_data/generic/*/*"]

[tool.setuptools.packages.find]
where = ["src"]
