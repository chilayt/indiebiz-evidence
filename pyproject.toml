[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indiebiz-evidence"
version = "0.5.1"
description = "Auditable evidence layer for your own periodic captures: CSV/JSON import, anomaly detection, and an MCP server your agent can query"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
indiebiz_evidence = ["schema.sql"]

[tool.setuptools.packages.find]
where = ["src"]
